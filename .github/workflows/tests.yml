name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Oflayn smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Sintaksis tekshiruvi
        run: python -m compileall -q .

      - name: Callback to'qnashuvlari
        run: python tests/check_callbacks.py

      - name: Smoke test
        run: python tests/smoke_test.py
