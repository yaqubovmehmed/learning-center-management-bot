services:
  bot:
    build: .
    container_name: excellence-lc-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/excellence.db
      TIMEZONE: Asia/Tashkent
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
